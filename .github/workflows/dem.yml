name: Build flood elevation tiles

# Downloads USGS 3DEP 1 m elevation for flood-prone areas (FEMA zones and the coastal reach)
# and commits tiles under data/dem so the app's flood depth map loads quickly.
on:
  workflow_dispatch:
    inputs:
      towns:
        description: "Towns to build, comma-separated as in the parcel layer (blank = all, SECOG towns first)"
        required: false
        default: ""
      force:
        description: "Rebuild towns that already have tiles"
        type: boolean
        default: false
  schedule:
    - cron: "41 7 15 1 *"

permissions:
  contents: write

concurrency:
  group: dem
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install tile tools
        run: npm install --no-save --no-package-lock geotiff@2.1.3 pngjs@7.0.0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Build tiles
        env:
          TOWNS: ${{ github.event.inputs.towns }}
          FORCE: ${{ github.event_name == 'schedule' && 'true' || github.event.inputs.force }}
          MAX_MINUTES: "300"
          GIT_COMMIT: "true"
        run: node scripts/build-dem.mjs
